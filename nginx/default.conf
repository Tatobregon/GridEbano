# nginx como "puerta única" (reverse-proxy): sirve el frontend + boards y proxea couch-auth y couchdb
# bajo el MISMO origen (443 vía Caddy en el server, o vía Funnel en la PC). Así todo va por un solo puerto, same-origin (sin CORS), con
# security headers, rate limiting en login, y /register bloqueado en el borde.
#
# [revisión 2026-09-22] Superficie mínima: solo se publica lo que la app usa.
#   - /couchdb/_*  (Fauxton, _session, _all_dbs, _users, _node...) -> 404. El sync solo usa las bases
#     de usuario (asterics-grid-data$...).
#   - /auth/*      -> lista blanca: login, logout, logout-all, refresh. El resto (register,
#     request-deletion = "Eliminar usuario online", password-*, change-email...) -> 404.
#   - /user/* y /api/* -> 404 (validate-username y infotree: la app ya no los usa).
#   - /admin/*     -> zona de rate limit propia y estricta (antes compartía la del login).
#   - /.git, /node_modules -> 404 (defensa extra; el fix de fondo es no copiarlos a la imagen).
#   - /Asterics-AAC-Data/ inexistente -> 404 limpio en vez de index.html con 200.

# Cache-Control por ruta (mapa) para poder mantener TODOS los add_header a nivel server
# (si un location tuviera su propio add_header, nginx NO hereda los headers del server).
map $uri $cache_control {
    default                "";
    "/"                    "no-cache";
    ~*/index\.html$        "no-cache";
    ~*/serviceworker\.js$  "no-cache";
    # El panel de admin cambia con cada mejora; sin esto el navegador podía seguir mostrando la
    # versión vieja (y por ejemplo no aparecía la solapa de recuperar comunicador).
    "/crear-usuario-ebano-soluciones" "no-cache";
}

# Rate limit para el login (mitiga fuerza bruta / credential stuffing).
# Por IP real del cliente (ver "IP real" en el server). Si el proxy de adelante no manda
# X-Forwarded-For, funciona como límite global (igual frena un ataque de fuerza bruta).
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
# Panel de admin: zona propia, estricta (lo usa una sola persona). 20r/m + burst 10 alcanza para
# el flujo real del panel (verificar la clave, listar usuarios, leer un comunicador, algún reintento)
# y sigue siendo nada para fuerza bruta contra ADMIN_UI_PASSWORD.
limit_req_zone $binary_remote_addr zone=admin:1m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- IP real del cliente ---
    # En producción adelante está Caddy (y localmente, el Funnel): sin esto nginx ve la IP del proxy
    # y el rate limit se vuelve GLOBAL (un atacante trabaría el login de todos). Confiamos en el
    # X-Forwarded-For solo si el pedido viene de la red interna de Docker / localhost (los únicos
    # que pueden hablarle a este nginx: sus puertos no están publicados a internet).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Body grande para el sync de PouchDB (tableros con imágenes base64 pueden pesar varios MB).
    client_max_body_size 64m;

    # --- Security headers (defensa en profundidad; a nivel server, sin add_header en locations) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP conservadora: bloquea clickjacking (frame-ancestors), objetos y base-uri, SIN tocar
    # script/style/connect (una CSP estricta de scripts rompería la app de terceros; se afina aparte).
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Cache-Control $cache_control always;

    # --- Bloqueo del registro público en el borde ---
    # (Redundante con la lista blanca de /auth/, se deja explícito por claridad.)
    location = /auth/register { return 403; }

    # --- Login con rate limiting ---
    location = /auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://couch-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- couch-auth: SOLO las rutas que usa la app (superlogin-client) ---
    location ~ ^/auth/(logout|logout-all|refresh)$ {
        proxy_pass http://couch-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Todo lo demás de couch-auth queda cerrado al público. El admin sigue creando/borrando usuarios
    # por localhost:3000 (scripts) o por el panel (/admin/, que llama a /auth/register internamente).
    location /auth/ { return 404; }
    location /user/ { return 404; }
    location /api/  { return 404; }

    # --- CouchDB: nada que empiece con "_" (Fauxton, _session, _all_dbs, _users, _node...) ---
    # Un location regex le gana al prefijo /couchdb/ de abajo.
    location ~ ^/couchdb/_ { return 404; }

    # --- CouchDB (sync de PouchDB), same-origin bajo /couchdb/ ---
    location /couchdb/ {
        proxy_pass http://couchdb:5984/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;   # feeds _changes de larga duración
        proxy_buffering off;
    }

    # Features de la fundación neutralizadas (podcast, CORS-proxy) apuntan acá → 404 → degradan solas.
    location = /_feature_deshabilitada { return 404; }

    # --- Panel de admin para crear usuarios (protegido por clave de acceso) ---
    location = /crear-usuario-ebano-soluciones { try_files /admin-crear-usuario.html =404; }
    location /admin/ {
        limit_req zone=admin burst=10 nodelay;   # anti fuerza bruta de la clave de acceso
        proxy_pass http://couch-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # "Recuperar comunicador" devuelve TODOS los tableros cifrados de un usuario: con imágenes
        # pueden ser varios MB y tardar. Con los 60s por defecto la respuesta se cortaba a medias.
        proxy_read_timeout 300s;
    }

    # Nunca servir archivos ocultos (.git, etc.) ni node_modules aunque terminen en el web root.
    # (El fix de fondo es no copiarlos a la imagen: ver Dockerfile.frontend.)
    location ~ /\. { return 404; }
    location ^~ /node_modules/ { return 404; }

    # Mirror de tableros: si un archivo no existe, 404 limpio (sin esto nginx devolvía index.html
    # con 200, y el service worker podía cachear HTML bajo una URL de tablero).
    location /Asterics-AAC-Data/ { try_files $uri =404; }

    # --- Frontend estático + mirror de tableros + SPA (hash routing) ---
    location / { try_files $uri $uri/ /index.html; }
}
