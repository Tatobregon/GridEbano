# nginx como "puerta única" (reverse-proxy): sirve el frontend + boards y proxea couch-auth y couchdb
# bajo el MISMO origen (443 vía Funnel). Así todo va por un solo puerto, same-origin (sin CORS), con
# security headers, rate limiting en login, y /register bloqueado en el borde.

# Cache-Control por ruta (mapa) para poder mantener TODOS los add_header a nivel server
# (si un location tuviera su propio add_header, nginx NO hereda los headers del server).
map $uri $cache_control {
    default                "";
    "/"                    "no-cache";
    ~*/index\.html$        "no-cache";
    ~*/serviceworker\.js$  "no-cache";
}

# Rate limit para el login (mitiga fuerza bruta / credential stuffing).
# Nota: detrás del Funnel el IP del cliente suele verse como el del proxy, así que en la práctica
# funciona como un límite GLOBAL de intentos de login (igual frena un ataque de fuerza bruta).
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Body grande para el sync de PouchDB (tableros con imágenes base64 pueden pesar varios MB).
    client_max_body_size 64m;

    # --- Security headers (defensa en profundidad; a nivel server, sin add_header en locations) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP conservadora: bloquea clickjacking (frame-ancestors), objetos y base-uri, SIN tocar
    # script/style/connect (una CSP estricta de scripts rompería la app de terceros; se afina aparte).
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Cache-Control $cache_control always;

    # --- Bloqueo del registro público en el borde ---
    # El público (que llega por el Funnel → nginx) recibe 403. El admin crea usuarios con
    # crear-usuario.sh, que le pega a couch-auth por localhost:3000 (NO pasa por acá).
    location = /auth/register { return 403; }

    # --- Login con rate limiting ---
    location = /auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://couch-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- couch-auth (resto de /auth/*, /user/*, /api/*) ---
    location /auth/ {
        proxy_pass http://couch-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /user/ {
        proxy_pass http://couch-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://couch-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CouchDB (sync de PouchDB), same-origin bajo /couchdb/ ---
    location /couchdb/ {
        proxy_pass http://couchdb:5984/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;   # feeds _changes de larga duración
        proxy_buffering off;
    }

    # --- Frontend estático + mirror de tableros + SPA (hash routing) ---
    location / { try_files $uri $uri/ /index.html; }
}
