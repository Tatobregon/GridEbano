[couchdb]
single_node = true
uuid = 81010998d6ce194db4f16486735bcbfd

# Sin CORS: el navegador habla con CouchDB a través del nginx, en el MISMO origen que la app
# (/couchdb/), así que no hay pedidos cross-origin que habilitar. (La config vieja permitía
# localhost:9095 y la URL del Funnel, de cuando el navegador iba directo a :5984.)
[chttpd]
enable_cors = false

# Este archivo se monta como 00-custom.ini (ordena antes que el docker.ini del entrypoint), así que
# CouchDB persiste su estado de runtime (el hash del admin) en ESE archivo efímero, NO acá. Por eso
# este config queda limpio y versionable. El `uuid` fijo mantiene estable el id de la instancia.
